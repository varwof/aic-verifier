name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Version tag is not behind (single source of truth)
        run: ./hack/versioncheck.sh

      - name: Consumer view (dependencies from the module proxy)
        run: ./hack/consumer-view.sh

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Smoke (build tag)
        run: go test -tags smoke ./smoke/

      - name: Showcase (end-to-end, must exit 0)
        run: go run ./examples/showcase
